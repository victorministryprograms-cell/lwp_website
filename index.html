<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Loveworld Ministry Programs — Coming Soon" />
  <title>Loveworld Ministry Programs — Coming Soon</title>
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="#">
      <span class="brand__chip">
        <img class="brand__logo" src="assets/icons/logo.png" alt="Loveworld Ministry logo" />
      </span>
      <span class="brand__text">Loveworld <span class="brand__text-accent">Ministry</span></span>
    </a>
  </header>

  <main class="hero">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="hero__overlay" aria-hidden="true"></div>
    <div class="hero__orb hero__orb--one" aria-hidden="true"></div>
    <div class="hero__orb hero__orb--two" aria-hidden="true"></div>

    <div class="hero__content">
      <h1 class="hero__title">Loveworld Ministry Programs</h1>
      <span class="hero__divider" aria-hidden="true"></span>
      <p class="hero__subtitle">Coming Soon</p>
    </div>
  </main>

  <script>
    (function () {
      var bg = document.querySelector('.hero__bg');
      var content = document.querySelector('.hero__content');
      var fine = window.matchMedia('(pointer: fine)').matches;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!bg || !content || !fine || reduce) return;

      var targetX = 0, targetY = 0, x = 0, y = 0;

      window.addEventListener('mousemove', function (e) {
        targetX = e.clientX / window.innerWidth - 0.5;
        targetY = e.clientY / window.innerHeight - 0.5;
      });

      function frame() {
        x += (targetX - x) * 0.06;
        y += (targetY - y) * 0.06;
        bg.style.transform = 'scale(1.08) translate3d(' + (x * -28) + 'px,' + (y * -18) + 'px,0)';
        content.style.transform = 'translate3d(' + (x * 10) + 'px,' + (y * 7) + 'px,0)';
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
